<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | VaaniSetu</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>


<body class="login-page">


    <div class="login-container">


        <!-- LOGO -->

        <a href="index.html"
           class="login-logo">

            <div class="logo-icon">
                व
            </div>

            <div>

                <h2>
                    VaaniSetu
                </h2>

                <span>
                    Language Bridge
                </span>

            </div>

        </a>


        <!-- HEADING -->

        <div class="login-heading">

            <h1>
                Welcome Back!
            </h1>

            <p>
                Login to continue using VaaniSetu.
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <div class="password-label">

                    <label for="password">
                        Password
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- REMEMBER -->

            <div class="remember">

                <label>

                    <input
                        type="checkbox"
                        name="remember">

                    Remember me

                </label>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-submit">

                Login →

            </button>

        </form>


        <!-- SIGN UP -->

        <div class="signup">

            <p>

                Don't have an account?

                <a href="#">
                    Create Account
                </a>

            </p>

        </div>


        <!-- BACK -->

        <a
            href="index.html"
            class="back-home">

            ← Back to VaaniSetu

        </a>


    </div>


</body>

</html>
